[project]
name = "gxp-copilot"
version = "0.0.0"
description = "Assistant RAG ancre sur un corpus reglementaire public (integrite des donnees / ALCOA+). Demonstration technique, donnees 100% publiques."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Rayan Kroubi" }]

dependencies = [
    # Configuration
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    # Base de donnees (Postgres + pgvector)
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    # Ingestion documentaire
    "httpx>=0.27",
    "pymupdf>=1.24",      # extraction texte + numero de page
    "pdfplumber>=0.11",   # extraction de tableaux
    "tiktoken>=0.7",      # comptage de tokens pour le chunking
    # Fournisseur cloud (defaut V1)
    "mistralai>=1.0",
    # API (Phase 1)
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.5",
    "pytest>=8.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "ingestion"]

[tool.uv]
package = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
